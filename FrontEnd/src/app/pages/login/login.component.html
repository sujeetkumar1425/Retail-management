<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand"><div class="brand-icon">R</div><strong>RetailPro</strong></div>
    <h1>Welcome back</h1>
    <p class="muted">Sign in to manage your retail inventory.</p>

    <div class="alert error" *ngIf="error">{{ error }}</div>

    <form (ngSubmit)="submit()">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" name="email" placeholder="admin@retail.com" required>

      <label>Password</label>
      <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" required>

      <button class="primary full" type="submit" [disabled]="loading">
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <p class="switch">Don't have an account? <a routerLink="/register">Create account</a></p>
  </div>
</div>
