<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand"><div class="brand-icon">R</div><strong>RetailPro</strong></div>
    <h1>Create account</h1>
    <p class="muted">Create a staff account for the inventory system.</p>

    <div class="alert error" *ngIf="error">{{ error }}</div>
    <div class="alert success" *ngIf="success">{{ success }}</div>

    <form (ngSubmit)="submit()">
      <label>Full name</label>
      <input type="text" [(ngModel)]="name" name="name" placeholder="Admin User" required>

      <label>Email</label>
      <input type="email" [(ngModel)]="email" name="email" placeholder="you@retail.com" required>

      <label>Password</label>
      <input type="password" [(ngModel)]="password" name="password" placeholder="Create a password" required>

      <button class="primary full" type="submit" [disabled]="loading">
        {{ loading ? 'Creating...' : 'Create Account' }}
      </button>
    </form>

    <p class="switch">Already have an account? <a routerLink="/login">Sign in</a></p>
  </div>
</div>
